<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/forgotpassword.css">
</head>
<body>

  <main class="card">
    <header class="card-header">
      <span class="avatar" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="34" height="34">
          <circle cx="24" cy="24" r="23" fill="none" stroke="currentColor" stroke-width="2"/>
          <rect x="15" y="22" width="18" height="13" rx="3" fill="currentColor"/>
          <path d="M19 22v-4a5 5 0 0 1 10 0v4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </span>
      <h1>Forgot Password?</h1>
      <p>We'll email you a reset link</p>
    </header>

    <form class="card-body" id="forgotForm" novalidate>

      <p class="hint">Enter the email you signed up with and we'll send you a link to reset your password.</p>

      <div class="field">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M3 7l9 6.5L21 7"/></svg>
          <input type="email" id="email" name="email" placeholder="your.email@example.com" autocomplete="email" required>
        </div>
      </div>

      <p class="form-error" id="formError" role="alert" hidden></p>
      <p class="form-success" id="formSuccess" role="status" hidden></p>

      <button type="submit" class="btn-primary">
        <span class="btn-label">Send reset link</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>

      <p class="switch">Remembered it? <a href="../../../index.html">Log in</a></p>
    </form>

    <noscript>
      <p class="noscript-note">JavaScript is turned off or blocked, so the form can't work. Open this page in a normal browser tab.</p>
    </noscript>
  </main>

  <script src="forgot-password.js" onerror="var e=document.getElementById('formError');e.textContent='forgot-password.js could not be loaded. Keep it in the same folder as forgot-password.html.';e.hidden=false;"></script>
</body>
</html>
