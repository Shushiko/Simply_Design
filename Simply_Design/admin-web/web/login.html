<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="icon" type="png" href="../../admin-web/images/logo.png" />
    <link rel="stylesheet" href="../../admin-web/style/style.css" />
    <title>Simply Design</title>
  </head>
  <body>
    <div class="login">
      <div class="login-container">
        <div class="login-header">
          <i class="fa-regular fa-circle-user"></i>
          <p class="login-message">Welcome Back</p>
          <p class="login-submess">Sign in to continue</p>
        </div>
        <div class="login-body">
          <p class="form">Email Address</p>
          <div class="login-email">
            <i class="fa-regular fa-envelope"></i>
            <input
              class="email"
              type="text"
              name="email"
              id="email"
              placeholder="your.email@example.com"
              autofocus="1"
              autocomplete="on"
              aria-label="your.email@example.com"
              required
            />
          </div>
          <div class="password-body">
            <p class="form">Password</p>
            <i class="fa-solid fa-lock"></i>
            <input
              class="password"
              type="password"
              name="password"
              id="password"
              placeholder="Enter your password"
              aria-label="Enter your password"
              required
            />
            <i
              class="fa-solid fa-eye-slash"
              id="show-password"
              role="button"
              tabindex="0"
              aria-label="Show password"
            ></i>
            <i
              class="fa-solid fa-eye"
              id="hide-password"
              role="button"
              tabindex="0"
              aria-label="Hide password"
            ></i>
          </div>
          <div class="signin-btn">
            <i class="fa-solid fa-arrow-right-to-bracket"></i>
            <button class="sign-in">Sign in</button>
          </div>
          <div class="social-divider">
            <span>or continue with</span>
          </div>
          <div class="social-login">
            <button
              class="social-btn google-btn"
              type="button"
              aria-label="Continue with Google"
              title="Continue with Google"
            >
              <i class="fa-brands fa-google"></i>
            </button>
            <button
              class="social-btn facebook-btn"
              type="button"
              aria-label="Continue with Facebook"
              title="Continue with Facebook"
            >
              <i class="fa-brands fa-facebook-f"></i>
            </button>
          </div>
          <div class="signup">
            <p class="sign-up-message">
              Don't have an account? <a href="signup.html"><span class="signup-link">Sign up</span></a>
            </p>
          </div>
        </div>
      </div>
    </div>
    <script src="../../admin-web/javascript/animation.js" defer></script>
  </body>
</html>
