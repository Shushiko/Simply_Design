<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password</title>
  <script src="../javascript/theme.js"></script>
  <link rel="icon" type="image/png" href="../../../Simply_Design/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/forgotpassword.css">
</head>
<body>

  <main class="card">
    <header class="card-header">
      <span class="avatar" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="34" height="34">
          <circle cx="24" cy="24" r="23" fill="none" stroke="currentColor" stroke-width="2"/>
          <rect x="15" y="22" width="18" height="13" rx="3" fill="currentColor"/>
          <path d="M19 22v-4a5 5 0 0 1 10 0v4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </span>
      <h1>Reset Password</h1>
      <p>Choose a new password</p>
    </header>

    <!-- Shown when the link is missing, wrong or expired -->
    <div class="card-body" id="resetInvalid" hidden>
      <p class="form-error" role="alert">This reset link is invalid or has expired. Reset links work for 30 minutes, and only in the browser you asked for them in.</p>
      <p class="switch"><a href="forgotpassword.html">Send me a new link</a></p>
    </div>

    <!-- Shown after the password was changed -->
    <div class="card-body" id="resetDone" hidden>
      <p class="form-success" role="status">Your password was updated. You can log in with it now.</p>
      <p class="switch"><a href="login.html">Go to Log in</a></p>
    </div>

    <form class="card-body" id="resetForm" novalidate hidden>
      <p class="hint" id="resetFor"></p>

      <div class="field">
        <label for="newPassword">New Password</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
          <input type="password" id="newPassword" name="newPassword" placeholder="At least 8 characters" autocomplete="new-password" required>
          <button type="button" class="toggle" data-target="newPassword" aria-label="Show password">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M3 3l18 18"/></svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm New Password</label>
        <div class="input-wrap">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" autocomplete="new-password" required>
          <button type="button" class="toggle" data-target="confirmPassword" aria-label="Show password">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M3 3l18 18"/></svg>
          </button>
        </div>
      </div>

      <p class="form-error" id="formError" role="alert" hidden></p>

      <button type="submit" class="btn-primary">
        <span class="btn-label">Update password</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>

      <p class="switch">Remembered it? <a href="login.html">Log in</a></p>
    </form>

    <noscript>
      <p class="noscript-note">JavaScript is turned off or blocked, so the form can't work. Open this page in a normal browser tab.</p>
    </noscript>
  </main>

  <script src="../javascript/resetpassword.js"></script>
</body>
</html>
