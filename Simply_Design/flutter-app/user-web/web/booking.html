<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking | Simply Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../javascript/auth.js" defer></script>
  <script src="../javascript/items.js" defer></script>
  <script src="../javascript/booking.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="user.html">Simply <span>Design</span></a>
    <span class="tagline">Gown &amp; Suit Rentals</span>
    <nav class="auth"><a href="../../../../index.html">Log in</a><i></i><a href="../../../admin-web/web/signup.html">Sign up</a></nav>
  </header>

  <!-- Filled in by booking.js from ?code=ITEMCODE -->
  <main class="bk" id="booking"></main>

  <!-- Payment popup: opened by the Rent Now button (logic is in booking.js) -->
  <div class="pm-overlay" id="payModal" role="dialog" aria-modal="true" aria-labelledby="pmTitle" hidden>
    <div class="pm-modal">
      <div class="pm-head">
        <h2 id="pmTitle">Select Payment Method</h2>
        <p>Complete your reservation</p>
      </div>

      <div class="pm-body" id="pmForm">
        <div class="pm-summary">
          <div class="lbl">Order Summary</div>
          <div class="pm-sum-top"><strong id="pmItem">Long Gown</strong><span>RENTAL FEE</span></div>
          <div class="pm-sum-bot"><div>Dates: <b id="pmDates"></b></div><div class="pm-fee" id="pmFee"></div></div>
        </div>

        <p class="pm-section">Select Payment Method</p>
        <fieldset class="pm-methods" aria-label="Payment method">
          <label class="pm-opt">
            <input type="radio" name="pay" value="GCash" checked>
            <span class="pm-ico gcash">G</span>
            <span class="pm-txt"><b>GCash</b><span>E-Wallet Transfer</span></span>
            <span class="pm-tag blue">Instant</span>
          </label>
          <label class="pm-opt">
            <input type="radio" name="pay" value="Cash">
            <span class="pm-ico cash"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9v.01M18 15v.01"/></svg></span>
            <span class="pm-txt"><b>Cash</b><span>Pay at Store Pickup</span></span>
          </label>
          <label class="pm-opt">
            <input type="radio" name="pay" value="Maya">
            <span class="pm-ico maya">M</span>
            <span class="pm-txt"><b>Maya</b><span>E-Wallet Transfer</span></span>
            <span class="pm-tag green">Instant</span>
          </label>
          <label class="pm-opt">
            <input type="radio" name="pay" value="Debit / Card">
            <span class="pm-ico card"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18"/></svg></span>
            <span class="pm-txt"><b>Debit / Card</b><span>Visa / Mastercard</span></span>
          </label>
        </fieldset>

        <div class="pm-card" id="pmCard">
          <label class="pm-field">Card Number *
            <input type="text" id="cardNo" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456" maxlength="19">
          </label>
          <div class="pm-grid2">
            <label class="pm-field">Expiry Date
              <input type="text" id="cardExp" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/YY" maxlength="5">
            </label>
            <label class="pm-field">CVV / CVC
              <input type="password" id="cardCvv" inputmode="numeric" autocomplete="cc-csc" placeholder="123" maxlength="4">
            </label>
          </div>
        </div>

        <div class="pm-notice" id="pmNotice" hidden>
          <div class="pm-notice-box">
            <h3>
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 9l1-5h14l1 5M4 9v11h16V9M4 9c0 2 3 2 4 0 1 2 3 2 4 0 1 2 3 2 4 0 1 2 4 2 4 0M9 20v-6h6v6"/></svg>
              Store Pickup Payment Notice
            </h3>
            <p id="pmNoticeText"></p>
          </div>
        </div>

        <p class="pm-renter">Renter Information:</p>
        <div class="pm-renter-grid">
          <label class="pm-field"><span>Full Name</span><input type="text" id="renterName" autocomplete="name" placeholder="Full Name*" maxlength="60"></label>
          <label class="pm-field"><span>Mobile Number</span><input type="tel" id="renterPhone" autocomplete="tel" placeholder="Mobile Number *" maxlength="16"></label>
        </div>

        <p class="pm-error" id="pmError" role="alert"></p>
        <hr class="pm-rule">
        <div class="pm-actions">
          <button type="button" class="pm-cancel" id="pmCancel">Cancel</button>
          <button type="button" class="pm-confirm" id="pmConfirm">Confirm &amp; Book Rental</button>
        </div>
      </div>

      <div class="pm-body pm-done" id="pmDone" hidden></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

</body>
</html>
