<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simply Design | Gown &amp; Suit Rentals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Simply_Design/flutter-app/user-web/css/style.css">
  <script src="Simply_Design/flutter-app/user-web/javascript/auth.js" defer></script>
  <script src="Simply_Design/flutter-app/user-web/javascript/items.js" defer></script>
  <script src="Simply_Design/flutter-app/user-web/javascript/script.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">Simply <span>Design</span></a>
    <span class="tagline">Gown &amp; Suit Rentals</span>
    <nav class="auth"><a href="Simply_Design/admin-web/web/login.html">Log in</a><i></i><a href="Simply_Design/admin-web/web/signup.html">Sign up</a></nav>
  </header>

  <section class="hero">
    <p class="eyebrow">OUR COLLECTION</p>
    <h1>Welcome To Rental Shop by Jun Barreto Tabi</h1>
    <p class="sub">Gown Sales, Made to Order and Rentals</p>
    <a class="btn-contact" href="Simply_Design/flutter-app/user-web/web/contact.html">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      Contact Us
    </a>
  </section>

  <form class="filters" id="filters" autocomplete="off">
    <label>Type
      <select id="type">
        <option value="">All Types</option>
        <option>Long Gown</option>
        <option>Cocktail Dress</option>
        <option>Men Suit</option>
      </select>
    </label>
    <label><span class="lbl"><svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M21.4 11.6 12.4 2.6A2 2 0 0 0 11 2H4a2 2 0 0 0-2 2v7a2 2 0 0 0 .6 1.4l9 9a2 2 0 0 0 2.8 0l7-7a2 2 0 0 0 0-2.8zM6.5 8A1.5 1.5 0 1 1 6.5 5a1.5 1.5 0 0 1 0 3z"/></svg> Size</span>
      <select id="size">
        <option value="">All Sizes</option>
        <option>S</option><option>M</option><option>L</option><option>XL</option>
      </select>
    </label>
    <label>Color
      <select id="color">
        <option value="">All Colors</option>
        <option>Blue</option><option>Green</option><option>Red</option><option>Black</option>
      </select>
    </label>
    <label><span class="lbl"><svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-2 15-4-4 1.4-1.4 2.6 2.6 6.6-6.6L18 9l-8 8z"/></svg> Availability</span>
      <select id="avail">
        <option value="">All Status</option>
        <option>Available</option>
        <option>Booked</option>
      </select>
    </label>
    <label><span class="lbl"><svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M21.4 11.6 12.4 2.6A2 2 0 0 0 11 2H4a2 2 0 0 0-2 2v7a2 2 0 0 0 .6 1.4l9 9a2 2 0 0 0 2.8 0l7-7a2 2 0 0 0 0-2.8zM6.5 8A1.5 1.5 0 1 1 6.5 5a1.5 1.5 0 0 1 0 3z"/></svg> Price Range</span>
      <select id="price">
        <option value="">All Prices</option>
        <option value="lt1000">Under &#8369;1,000</option>
        <option value="1000-1500">&#8369;1,000 &ndash; &#8369;1,500</option>
        <option value="gt1500">Over &#8369;1,500</option>
      </select>
    </label>
    <label class="grow">Search
      <input type="search" id="search" placeholder="Search Code, Items, ...">
    </label>
    <div class="actions">
      <button class="btn-search" type="submit">Search</button>
      <button class="btn-clear" type="reset" id="clear">Clear</button>
    </div>
  </form>

  <p class="status" id="status" aria-live="polite"></p>

  <main id="catalog"></main>

  <div class="toast" id="toast" role="status"></div>
</body>
</html>
